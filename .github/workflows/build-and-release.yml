name: Build and Release

on:
  push:
    # merge-upstream-*: fork branches re-merging tizbac/master (see
    # patches/README.md) get the full build + tests; releases stay tag-only.
    # master is the fork's published branch: build + test every push there so
    # untagged test builds are available as workflow artifacts.
    branches: [ master, main, develop, github-release, 'merge-upstream-*' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'

jobs:
  # Check for outdated dependencies (informational only)
  check-deps:
    name: Check Dependency Updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check for available updates
        working-directory: gui
        env:
          GOWORK: off
        run: |
          echo "📦 Current dependencies and available updates:"
          echo "================================================"
          go list -u -m all | grep '\[' || echo "✅ All dependencies are up to date!"
          echo ""
          echo "Legend: module current-version [latest-version]"
          echo "No brackets = already at latest version"

  # Security and quality checks
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        working-directory: gui
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Tidy dependencies
        working-directory: gui
        env:
          GOWORK: off
        run: go mod tidy

      - name: Run gosec
        env:
          GOWORK: off
        # Findings are also emitted as annotations (readable without access
        # to the job logs).
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          cd gui
          rc=0
          gosec -severity high -confidence high -fmt json -out "$RUNNER_TEMP/gosec.json" -stdout -verbose text ./... || rc=$?
          python3 - "$RUNNER_TEMP/gosec.json" <<'PY' || true
          import json, os, sys
          for i in json.load(open(sys.argv[1])).get("Issues") or []:
              f = os.path.relpath(i.get("file", ""), os.environ["GITHUB_WORKSPACE"])
              print(f"::error file={f},line={i.get('line','1').split('-')[0]}::gosec {i.get('rule_id')}: {i.get('details')}")
          PY
          exit $rc

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: gui
          args: --timeout=5m
        env:
          GOWORK: off

  # Upstream's `make lint`: golangci-lint over EVERY module, not only gui.
  # Informational until the existing findings outside gui are cleaned up:
  # it reports, it does not block.
  lint-all:
    name: Lint all modules (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      # Same module loop as `make lint`, with no per-linter / same-issue caps.
      # golangci-lint writes JSON to a file and its console output stays out
      # of the log (it was turned into 10 capped, path-less annotations). The
      # findings, prefixed with their module, are packed into error + warning
      # + notice annotations (10 per level, 4 KB each) so the whole list is
      # readable without downloading the job log.
      - name: Lint every module
        run: |
          lint_bin=$(command -v golangci-lint || echo "$HOME/go/bin/golangci-lint")
          ws=$(sed -nE 's/^WORKSPACE_MODULES *:= *//p' Makefile)
          sa=$(sed -nE 's/^STANDALONE_MODULES *:= *//p' Makefile)
          out="$RUNNER_TEMP/lint"
          mkdir -p "$out"
          rc=0
          for m in $ws $sa; do
            gowork=auto
            case " $sa " in *" $m "*) gowork=off ;; esac
            name=$(echo "$m" | tr / _)
            echo "==> $m"
            ( cd "$m" && GOWORK=$gowork "$lint_bin" run --max-issues-per-linter=0 --max-same-issues=0 \
                --output.json.path="$out/$name.json" ./... ) > "$out/$name.log" 2>&1 || rc=1
            echo "$m" > "$out/$name.module"
          done
          python3 - "$out" <<'PY'
          import collections, glob, json, os, sys
          out = sys.argv[1]
          lines = []
          for mod_file in sorted(glob.glob(os.path.join(out, "*.module"))):
              base = mod_file[: -len(".module")]
              mod = open(mod_file).read().strip()
              try:
                  issues = json.load(open(base + ".json")).get("Issues") or []
              except Exception:
                  tail = open(base + ".log", errors="replace").read()[-600:].replace("\n", " / ")
                  lines.append(f"{mod}: no JSON report ({tail}) (run)")
                  continue
              for i in issues:
                  p = i.get("Pos", {})
                  # Paths are relative to the module, or to the directory of the
                  # .golangci.yml in use (gui/api reads gui's): keep the one
                  # that exists.
                  fn = p.get("Filename", "")
                  path = next((c for c in (os.path.join(mod, fn), os.path.join(os.path.dirname(mod), fn)) if os.path.exists(c)), os.path.join(mod, fn))
                  lines.append(f"{path}:{p.get('Line')}: {i.get('Text')} ({i.get('FromLinter')})")
          # "| " keeps setup-go's Go problem matcher off these lines.
          print("\n".join("| " + l for l in lines))
          if not lines:
              sys.exit(0)
          per = collections.Counter(l.rsplit("(", 1)[-1].rstrip(")") for l in lines)
          head = f"{len(lines)} findings: " + ", ".join(f"{k} {v}" for k, v in per.most_common())
          chunks, cur = [], head + "\n"
          for l in lines:
              if len((cur + l + "\n").encode()) > 3500:
                  chunks.append(cur)
                  cur = ""
              cur += l[:3400] + "\n"
          chunks.append(cur)
          levels = ["error"] * 10 + ["warning"] * 10 + ["notice"] * 10
          for n, (lvl, c) in enumerate(zip(levels, chunks), 1):
              msg = c.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::{lvl} title=Lint {n}/{len(chunks)}::{msg}")
          PY
          exit $rc

  # Unit tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        working-directory: gui
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Tidy dependencies
        working-directory: gui
        env:
          GOWORK: off
        run: go mod tidy

      - name: Run tests
        working-directory: gui
        env:
          GOWORK: off
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Generate coverage
        working-directory: gui
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./gui/coverage.out

  # Run the unit tests that live OUTSIDE the gui module (pbscommon, pkg/*, snapshot).
  # The "test" job above only covers gui/; these modules previously had zero CI
  # coverage despite shipping the chunker, catalog/didx readers, retry logic and
  # VSS helpers. Matrixed so Windows-only code (snapshot) is exercised too. [audit Q-9]
  test-modules:
    name: Test non-GUI modules (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Gating (in build-cli/build-gui needs): a failing pbscommon/pkg/*/snapshot
    # test blocks the build and release. [Q-9]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Test cross-platform modules
        shell: bash
        env:
          GOWORK: off
        run: |
          rc=0
          for m in pbscommon pkg/retry pkg/security; do
            echo "::group::go test $m"
            # go mod tidy first: these library modules are normally built via the
            # workspace / replace directives, so their own go.mod/go.sum can lack
            # imports (e.g. pbscommon -> cornelk/hashmap) that a GOWORK=off build
            # needs. Mirrors the gui "test" job.
            if ( cd "$m" && go mod tidy && go test ./... ); then
              echo "RESULT $m: PASS"
            else
              echo "RESULT $m: FAIL (see above)"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

      # machinebackuplib has no replace directives of its own: test it through
      # the machinebackup module, which maps pbscommon/snapshot. Only the
      # machine-info / VM-config tests (pure Go, platform-independent) for now;
      # -vet=off so pre-existing vet findings in the disk code do not gate this.
      - name: Test machine backup VM metadata
        if: runner.os == 'Linux'
        shell: bash
        env:
          GOWORK: off
        run: |
          set -e
          cd machinebackup && go mod tidy
          go test -vet=off -run 'SMBIOS|PVEOSType|QemuConfig|SanitizeVMName' machinebackuplib

      - name: Test Windows-only modules
        if: runner.os == 'Windows'
        shell: bash
        env:
          GOWORK: off
        run: |
          set -e
          echo "::group::go test snapshot"
          ( cd snapshot && go mod tidy && go test ./... )
          echo "::endgroup::"

  # Upstream's end-to-end suite against a real PBS in Docker (testing/e2e):
  # our backups restored by the official proxmox-backup-client, encrypted ones
  # included, and official encrypted backups read back by our code. Gates the
  # release.
  e2e:
    name: End-to-end (real PBS)
    uses: ./.github/workflows/e2e.yml

  # Build CLI for all platforms
  build-cli:
    name: Build CLI
    needs: [security, test, test-modules]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build CLI
        env:
          GOWORK: off
        run: make cli

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ runner.os }}
          path: dist/proxmoxbackup-*

  # Build GUI (Windows only for now)
  build-gui:
    name: Build GUI
    needs: [security, test, test-modules]
    runs-on: windows-latest
    # The environment pins the OIDC subject to
    # repo:rdemsystems/NimbusBackupClient:environment:signing, so one Azure
    # federated credential covers every branch and tag (a ref-based subject
    # cannot wildcard v* tags).
    environment: signing
    # id-token: OIDC login to Azure for code signing (no stored secret).
    permissions:
      contents: read
      id-token: write
    # Azure Artifact Signing. The account is not secret; the signing steps run
    # only once the repository variable AZURE_SIGNING_PROFILE (Public Trust
    # certificate profile) is set, with AZURE_CLIENT_ID / AZURE_TENANT_ID of
    # the app registration that has a federated credential for this repo and
    # the "Artifact Signing Certificate Profile Signer" role on the profile.
    env:
      SIGNING_ENDPOINT: https://swn.codesigning.azure.net/
      SIGNING_ACCOUNT: github-nimbus
      SIGNING_SUBSCRIPTION: 8d9f8b1c-7a41-46e2-a4de-d51407239a8a

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails
        # Pinned to the wails library version in gui/go.mod (v2.13.0, bumped by
        # upstream so the GUI builds on Debian 13 / webkit2gtk-4.1). A floating
        # CLI would make the build non-reproducible (the CLI orchestrates
        # frontend bundling + asset embedding before `go build`); a CLI older
        # than the library prints a version-mismatch warning and may miss
        # template changes. Bump both together.
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install Frontend Dependencies
        working-directory: gui/frontend
        run: npm install

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          # When the build is triggered by a tag push (v*), the tag is
          # the source of truth. For branch pushes / PRs we fall back to
          # wails.json + short SHA so dev builds get a sensible,
          # non-overlapping version string.
          #
          # VERSION feeds main.appVersion via ldflags (displayed in the
          # GUI, logged in each run banner). VERSION_MSI feeds the WiX
          # ProductVersion, which must be a strict x.y.z numeric tuple
          # — so on branch builds we strip the -dev-<sha> suffix for
          # the MSI but keep it on the binary.
          $base = (Get-Content gui/wails.json | ConvertFrom-Json).info.productVersion
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace "^v", ""
            $version_msi = $version
          } else {
            $shortSha = "${{ github.sha }}".Substring(0, 7)
            $version = "$base-dev-$shortSha"
            $version_msi = $base
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "VERSION_MSI=$version_msi" >> $env:GITHUB_OUTPUT
          echo "Building version: $version (MSI: $version_msi)"

      # Fork patch: upstream's wails.json carries the neutral "Proxmox Backup
      # Client" identity. Stamp the Nimbus Backup name/company into it before
      # the build so the GUI exe is NimbusBackup.exe (ProductBody.wxi installs
      # $(var.ExeName).exe; gui/brand.go picks the brand from that exe name)
      # with Nimbus version-info resources. Version is left untouched.
      - name: Apply Nimbus Backup brand to wails.json
        shell: pwsh
        run: |
          $w = Get-Content gui/wails.json -Raw | ConvertFrom-Json
          $w.name = "NimbusBackup"
          $w.outputfilename = "NimbusBackup"
          $w.author.name = "RDEM Systems"
          $w.author.email = "contact@rdem-systems.com"
          $w.info.companyName = "RDEM Systems"
          $w.info.productName = "Nimbus Backup"
          $w.info.copyright = "© 2024-2026 RDEM Systems and Proxmox Backup Client GO contributors."
          $w.info.comments = "Backup client for Proxmox Backup Server"
          $w | ConvertTo-Json -Depth 10 | Set-Content gui/wails.json -Encoding utf8

      - name: Build GUI
        working-directory: gui
        env:
          GOWORK: off
        run: wails build -clean -platform windows/amd64 -ldflags "-X main.appVersion=${{ steps.version.outputs.VERSION }}"

      # The service is a plain `go build` from gui/ and would otherwise ship
      # with no Windows version info — a strong heuristic/ML false-positive
      # signal (Codex review). Generate a .syso with proper CompanyName /
      # ProductName / version so NimbusBackupSVC.exe looks like normal signed-
      # vendor software. Must run AFTER the Wails GUI build (same package dir):
      # we strip any leftover .syso first so the GUI's resource can't leak into
      # the service link and cause a duplicate-resource error.
      - name: Generate service version resource
        working-directory: gui
        shell: pwsh
        run: |
          Remove-Item *.syso -ErrorAction SilentlyContinue
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.0
          $ver = "${{ steps.version.outputs.VERSION }}"
          $p = "${{ steps.version.outputs.VERSION_MSI }}" -split '\.'
          $json = @"
          {
            "FixedFileInfo": {
              "FileVersion":    { "Major": $($p[0]), "Minor": $($p[1]), "Patch": $($p[2]), "Build": 0 },
              "ProductVersion": { "Major": $($p[0]), "Minor": $($p[1]), "Patch": $($p[2]), "Build": 0 }
            },
            "StringFileInfo": {
              "CompanyName": "RDEM Systems",
              "FileDescription": "Nimbus Backup Service",
              "FileVersion": "$ver",
              "InternalName": "NimbusBackupSVC",
              "LegalCopyright": "Copyright (c) 2024-2026 RDEM Systems",
              "OriginalFilename": "NimbusBackupSVC.exe",
              "ProductName": "Nimbus Backup",
              "ProductVersion": "$ver"
            },
            "VarFileInfo": { "Translation": { "LangID": "0409", "CharsetID": "04B0" } }
          }
          "@
          $json | Out-File -Encoding utf8 versioninfo.json
          $gobin = (go env GOPATH) + "\bin\goversioninfo.exe"
          & $gobin -64 -o servicewinres.syso versioninfo.json

      - name: Build Service
        working-directory: gui
        env:
          GOWORK: off
        run: |
          go build -tags service -trimpath -buildmode=pie -ldflags "-s -w -X main.appVersion=${{ steps.version.outputs.VERSION }}" -o build/bin/NimbusBackupSVC.exe
        shell: pwsh

      - name: Azure login (code signing)
        if: ${{ vars.AZURE_SIGNING_PROFILE != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ env.SIGNING_SUBSCRIPTION }}

      # Sign the binaries BEFORE the MSI packs them (ProductBody.wxi takes
      # them from gui/build/bin), then the MSI itself below.
      - name: Sign executables
        if: ${{ vars.AZURE_SIGNING_PROFILE != '' }}
        uses: Azure/artifact-signing-action@v2.0.0
        with:
          endpoint: ${{ env.SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\gui\build\bin
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Copy binaries to dist
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item gui/build/bin/NimbusBackup.exe dist/
          Copy-Item gui/build/bin/NimbusBackupSVC.exe dist/
        shell: pwsh

      - name: Install WiX Toolset
        run: |
          choco install wixtoolset -y
          $env:PATH += ";C:\Program Files (x86)\WiX Toolset v3.14\bin"
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Build MSI Installer
        working-directory: installer/wix
        run: |
          # Pass the resolved version to the WiX preprocessor so MSI
          # metadata matches the tag / ldflags version.
          # Fork patch: build the Nimbus brand entry (NimbusBackup.wxs keeps the
          # UpgradeCode of every Nimbus MSI shipped so far), not upstream's
          # default Product.wxs.
          candle.exe "-dProductVersion=${{ steps.version.outputs.VERSION_MSI }}" NimbusBackup.wxs -ext WixUIExtension -ext WixUtilExtension
          light.exe NimbusBackup.wixobj -ext WixUIExtension -ext WixUtilExtension -out NimbusBackup.msi
          Copy-Item NimbusBackup.msi ../../dist/
        shell: pwsh

      - name: Sign MSI
        if: ${{ vars.AZURE_SIGNING_PROFILE != '' }}
        uses: Azure/artifact-signing-action@v2.0.0
        with:
          endpoint: ${{ env.SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      # Proof, not trust: every shipped Windows file must carry a Valid
      # Authenticode signature from RDEM SYSTEMS, with a timestamp, including
      # the executables the MSI installs (extracted with an administrative
      # install). Results are annotations, readable without the job log.
      - name: Verify signatures
        if: ${{ vars.AZURE_SIGNING_PROFILE != '' }}
        shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP 'msi-extract'
          Start-Process msiexec.exe -Wait -NoNewWindow -ArgumentList @('/a', "$PWD\dist\NimbusBackup.msi", '/qn', "TARGETDIR=$extract")
          $files = @('dist\NimbusBackup.exe', 'dist\NimbusBackupSVC.exe', 'dist\NimbusBackup.msi')
          $files += Get-ChildItem -Path $extract -Recurse -Filter *.exe | ForEach-Object { $_.FullName }
          $bad = 0
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature -FilePath $f
            $signer = if ($s.SignerCertificate) { $s.SignerCertificate.Subject } else { 'none' }
            $stamp = if ($s.TimeStamperCertificate) { 'timestamped' } else { 'NO timestamp' }
            $name = if ($f.StartsWith($extract)) { 'MSI:' + (Split-Path $f -Leaf) } else { Split-Path $f -Leaf }
            $ok = $s.Status -eq 'Valid' -and $signer -match '(^|, )CN=RDEM SYSTEMS(,|$)' -and $s.TimeStamperCertificate
            $level = if ($ok) { 'notice' } else { 'error' }
            Write-Output "::$level title=Signature ${name}::$($s.Status) - $signer - $stamp"
            if (-not $ok) { $bad++ }
          }
          if ($bad -gt 0) { throw "$bad file(s) are not validly signed by RDEM SYSTEMS" }

      # Install for real on this Windows runner, both ways users get it:
      # 1. a fresh install of this build's MSI on a clean machine;
      # 2. the published 0.4.0 MSI upgraded with this build's MSI.
      # Each time: one product at this version, the NimbusBackup service
      # pointing at a signed executable, then a clean uninstall.
      - name: Install and upgrade test
        shell: pwsh
        timeout-minutes: 30
        run: |
          # Waits for msiexec itself only (Start-Process -Wait also waits for
          # every descendant), 10 minutes at most; on a timeout or a failure
          # the end of the MSI log is published as an annotation.
          function Invoke-Msi([string[]]$msiArgs, [string]$what) {
            $log = $msiArgs[[array]::IndexOf($msiArgs, '/l*v') + 1]
            Write-Output "$what ..."
            $p = Start-Process msiexec.exe -PassThru -NoNewWindow -ArgumentList $msiArgs
            $done = $p.WaitForExit(600000)
            if (-not $done -or ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010)) {
              $why = if ($done) { "msiexec exit code $($p.ExitCode)" } else { 'timed out after 10 minutes' }
              if (-not $done) { $p.Kill() }
              $tail = if (Test-Path $log) { (Get-Content $log -Tail 40 -Encoding Unicode) -join "`n" } else { 'no MSI log' }
              if ($tail.Length -gt 3400) { $tail = $tail.Substring($tail.Length - 3400) }
              $msg = ($tail -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')
              Write-Output "::error title=$what ($why)::$msg"
              throw "${what}: $why"
            }
          }
          function Get-Nimbus {
            Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -eq 'Nimbus Backup' }
          }
          $expected = '${{ steps.version.outputs.VERSION_MSI }}'
          function Test-Installed([string]$label) {
            $products = @(Get-Nimbus)
            if ($products.Count -ne 1) { throw "${label}: expected one Nimbus Backup product, found $($products.Count): $($products.DisplayVersion -join ', ')" }
            if ($products[0].DisplayVersion -ne $expected) { throw "${label}: installed version $($products[0].DisplayVersion), expected $expected" }
            $svc = Get-CimInstance Win32_Service -Filter "Name='NimbusBackup'"
            if (-not $svc) { throw "${label}: the NimbusBackup service is not registered" }
            $svcExe = $svc.PathName.Trim('"').Split('"')[0].Trim()
            $bad = 0
            foreach ($f in @($svcExe, (Join-Path (Split-Path $svcExe) 'NimbusBackup.exe'))) {
              $s = Get-AuthenticodeSignature -FilePath $f
              if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch '(^|, )CN=RDEM SYSTEMS(,|$)') { $bad++ }
              Write-Output "::notice title=${label}: installed $(Split-Path $f -Leaf)::$($s.Status) - $($s.SignerCertificate.Subject)"
            }
            if ($bad -gt 0) { throw "${label}: $bad installed file(s) are not validly signed by RDEM SYSTEMS" }
            Write-Output "::notice title=${label}::one product at $expected, service NimbusBackup -> $svcExe ($($svc.StartMode), $($svc.State))"
          }
          function Test-Uninstall([string]$label) {
            Invoke-Msi @('/x', "$PWD\dist\NimbusBackup.msi", '/qn', '/norestart', '/l*v', "$logs\uninstall-$label.log") "${label}: uninstall"
            if (Get-Service -Name NimbusBackup -ErrorAction SilentlyContinue) { throw "${label}: the NimbusBackup service is still registered after uninstall" }
            if (@(Get-Nimbus).Count -ne 0) { throw "${label}: Nimbus Backup is still listed as installed after uninstall" }
            Write-Output "::notice title=${label}: uninstall::service and product removed"
          }
          $logs = Join-Path $env:RUNNER_TEMP 'msi-logs'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null

          if (@(Get-Nimbus).Count -ne 0) { throw 'the runner is not clean: Nimbus Backup is already installed' }
          Invoke-Msi @('/i', "$PWD\dist\NimbusBackup.msi", '/qn', '/norestart', '/l*v', "$logs\install-fresh.log") 'Fresh install'
          Test-Installed 'Fresh install'
          Test-Uninstall 'Fresh install'

          $old = Join-Path $env:RUNNER_TEMP 'NimbusBackup-0.4.0.msi'
          Invoke-WebRequest -Uri 'https://github.com/rdemsystems/NimbusBackupClient/releases/download/v0.4.0/NimbusBackup.msi' -OutFile $old
          Invoke-Msi @('/i', $old, '/qn', '/norestart', '/l*v', "$logs\install-0.4.0.log") 'Installing 0.4.0'
          if (-not (Get-Service -Name NimbusBackup -ErrorAction SilentlyContinue)) { throw '0.4.0 did not register the NimbusBackup service' }
          Write-Output "::notice title=Install 0.4.0::installed, service NimbusBackup registered"

          Invoke-Msi @('/i', "$PWD\dist\NimbusBackup.msi", '/qn', '/norestart', '/l*v', "$logs\upgrade.log") 'Upgrading to this build'
          Test-Installed "Upgrade 0.4.0 -> $expected"
          Test-Uninstall 'Upgrade'

      - name: Upload GUI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NimbusBackup-Windows
          path: |
            dist/NimbusBackup.exe
            dist/NimbusBackup.msi

  # Create release on tag
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-cli, build-gui, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # mint the Sigstore OIDC token for attestation
      attestations: write  # store the build-provenance attestation

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so `git describe`/`git log PREV_TAG..HEAD` in
          # the release-notes step can compute the previous tag and list the
          # commits since it. A shallow (depth-1) checkout has no prior tags,
          # which left the "What's in this release" section empty.
          fetch-depth: 0
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create release archives
        run: |
          mkdir -p release

          # CLI Windows
          cd artifacts/cli-Windows && zip ../../release/nimbus-backup-cli-${{ steps.version.outputs.VERSION }}-windows.zip *
          cd ../..

          # CLI Linux
          cd artifacts/cli-Linux && tar -czf ../../release/nimbus-backup-cli-${{ steps.version.outputs.VERSION }}-linux.tar.gz *
          cd ../..

          # CLI macOS
          cd artifacts/cli-macOS && tar -czf ../../release/nimbus-backup-cli-${{ steps.version.outputs.VERSION }}-macos.tar.gz *
          cd ../..

          # GUI Windows - Add .exe, .msi (with and without version) and .zip
          cd artifacts/NimbusBackup-Windows
          cp NimbusBackup.exe ../../release/NimbusBackup-${{ steps.version.outputs.VERSION }}.exe
          cp NimbusBackup.exe ../../release/NimbusBackup.exe
          cp NimbusBackup.msi ../../release/NimbusBackup-${{ steps.version.outputs.VERSION }}.msi
          cp NimbusBackup.msi ../../release/NimbusBackup.msi
          zip ../../release/NimbusBackup-${{ steps.version.outputs.VERSION }}-windows.zip *
          cd ../..

      - name: Generate SHA256 checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Free, OSS-friendly cryptographic provenance: attests that these exact
      # binaries were produced by THIS workflow, from THIS commit. Verifiable
      # with `gh attestation verify <file> --repo rdemsystems/NimbusBackupClient`.
      # A strong trust signal for a sysadmin audience while signing is pending.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/NimbusBackup*.exe
            release/NimbusBackup*.msi
            release/*.zip
            release/*.tar.gz

      # Best-effort: submit the Windows binaries to VirusTotal so the release
      # page can link a live multi-engine report (transparency while the
      # Authenticode certificate is pending). Skips cleanly if the secret is
      # absent and never fails the release. The GUI report URL is just the
      # file's SHA-256. We GATE the link on a clean result: a fresh hash can
      # show transient heuristic hits, and we must not publish a link to a
      # "2/70 detected" report as if it were proof of safety — so we poll the
      # analysis and only emit the link when malicious+suspicious == 0.
      - name: Submit to VirusTotal (best-effort, gated on 0 detections)
        continue-on-error: true
        env:
          VT_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          if [ -z "$VT_KEY" ]; then
            echo "VIRUSTOTAL_API_KEY not set — skipping VirusTotal submission."
            exit 0
          fi
          : > vt-section.md
          emitted=0
          VER="${{ steps.version.outputs.VERSION }}"
          # Use the version-stamped copies so the published label reads
          # "NimbusBackup-v0.2.106.msi" (identical bytes → same VT report).
          for f in "release/NimbusBackup-${VER}.exe" "release/NimbusBackup-${VER}.msi"; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            sha=$(sha256sum "$f" | awk '{print $1}')
            # Free public API: files must be <32MB (ours are); 4 req/min limit.
            resp=$(curl -sS --max-time 180 -X POST https://www.virustotal.com/api/v3/files \
              -H "x-apikey: $VT_KEY" --form file=@"$f" || true)
            aid=$(jq -r '.data.id // empty' <<<"$resp" 2>/dev/null || true)
            if [ -z "$aid" ]; then
              echo "WARN: VirusTotal submission failed for $name — omitting link."
              sleep 20; continue
            fi
            status=""; mal=0; susp=0
            for _ in $(seq 1 10); do
              sleep 20
              ar=$(curl -sS --max-time 60 -H "x-apikey: $VT_KEY" "https://www.virustotal.com/api/v3/analyses/$aid" || true)
              status=$(jq -r '.data.attributes.status // empty' <<<"$ar" 2>/dev/null || true)
              if [ "$status" = "completed" ]; then
                mal=$(jq  -r '(.data.attributes.stats.malicious  // 0) | tonumber? // 0' <<<"$ar" 2>/dev/null || echo 0)
                susp=$(jq -r '(.data.attributes.stats.suspicious // 0) | tonumber? // 0' <<<"$ar" 2>/dev/null || echo 0)
                break
              fi
            done
            if [ "$status" != "completed" ]; then
              echo "WARN: VirusTotal analysis not completed in time for $name — omitting link."
              continue
            fi
            if [ "$((mal + susp))" -gt 0 ]; then
              echo "WARN: VirusTotal reports $mal malicious / $susp suspicious for $name ($sha) — omitting link to avoid publishing a non-clean report."
              continue
            fi
            if [ "$emitted" -eq 0 ]; then
              { echo ""; echo "### 🛡️ VirusTotal reports — 0 detections"; echo ""; } >> vt-section.md
              emitted=1
            fi
            echo "- [\`$name\`](https://www.virustotal.com/gui/file/$sha) — clean" >> vt-section.md
          done
          if [ -s vt-section.md ]; then cat vt-section.md; else echo "No clean VirusTotal links to publish."; fi

      - name: Generate release notes
        id: notes
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}

          # Create release notes from RELEASE_NOTES.md + recent commits
          cat > RELEASE_BODY.md << 'EOFNOTES'
          # 🚀 Nimbus Backup ${{ steps.version.outputs.VERSION }}

          > 🔏 **Signed by RDEM SYSTEMS.** `NimbusBackup.exe`, its service and `NimbusBackup.msi` are Authenticode-signed (Azure Artifact Signing): *Properties → Digital Signatures* shows RDEM SYSTEMS. SmartScreen may still warn on a new release until its reputation is established: check that the publisher is RDEM SYSTEMS, then *More info → Run anyway*. The command-line tools are not signed yet. Antivirus false positive? See [why this happens and how to verify the download](https://nimbus.rdem-systems.com/en/antivirus-false-positive/) · [🇫🇷 FR](https://nimbus.rdem-systems.com/faux-positif-antivirus/).

          ## 📝 What's in this release

          EOFNOTES

          # This version's CHANGELOG section (## [x.y.z] up to the next ## [).
          # Not "git log since the previous tag": the fork is rebuilt on
          # upstream, so the previous Nimbus tag is not an ancestor and the
          # log would list hundreds of upstream commits.
          awk -v v="${VERSION#v}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > changelog-section.md
          if [ -s changelog-section.md ]; then
            cat changelog-section.md >> RELEASE_BODY.md
          else
            echo "See [CHANGELOG.md](CHANGELOG.md)." >> RELEASE_BODY.md
          fi
          echo "" >> RELEASE_BODY.md

          # Publish the SHA-256 checksums on the release page itself so users
          # can verify integrity without downloading SHA256SUMS.txt first.
          echo "" >> RELEASE_BODY.md
          echo "### 🔐 SHA-256 checksums" >> RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          echo "Verify with \`Get-FileHash <file> -Algorithm SHA256\` (PowerShell) or \`sha256sum -c SHA256SUMS.txt\`." >> RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          echo '```' >> RELEASE_BODY.md
          cat release/SHA256SUMS.txt >> RELEASE_BODY.md
          echo '```' >> RELEASE_BODY.md

          # VirusTotal links (produced by the best-effort step above, if any)
          if [ -f vt-section.md ]; then
            cat vt-section.md >> RELEASE_BODY.md
          fi

          # Add full status from RELEASE_NOTES.md
          echo "" >> RELEASE_BODY.md
          echo "---" >> RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          cat RELEASE_NOTES.md >> RELEASE_BODY.md

          # Add tested with section
          echo "" >> RELEASE_BODY.md
          echo "---" >> RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          echo "### Tested with NimbusBackup" >> RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          echo "This release has been tested against NimbusBackup managed PBS — [🇬🇧 EN](https://nimbus.rdem-systems.com/en/blog/backup-windows-proxmox-backup-server/?utm_source=github) · [🇫🇷 FR](https://nimbus.rdem-systems.com/blog/sauvegarder-windows-proxmox-backup-server/?utm_source=github)." >> RELEASE_BODY.md

          # Add links at the end (FR bare URL + EN /en/ variant)
          echo "" >> RELEASE_BODY.md
          echo "---" >> RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          echo "**RDEM Systems** — [🇬🇧 EN](https://www.rdem-systems.com/en/) · [🇫🇷 FR](https://www.rdem-systems.com/)" >> RELEASE_BODY.md
          echo "" >> RELEASE_BODY.md
          echo "**Nimbus Backup — Fully managed Proxmox Backup Server datastores** — [🇬🇧 EN](https://nimbus.rdem-systems.com/en/?utm_source=github) · [🇫🇷 FR](https://nimbus.rdem-systems.com/?utm_source=github)" >> RELEASE_BODY.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: RELEASE_BODY.md
          files: release/*
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest release badge
        if: ${{ !contains(steps.version.outputs.VERSION, '-') }}
        run: |
          echo "Latest stable release: ${{ steps.version.outputs.VERSION }}"
